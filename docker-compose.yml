# docker-compose.yml
services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - frontend-next
      - web
      - daphne

  frontend: 
    build: ./Frontend
    ports: 
      - 3000:3000
    depends_on:
      - web

  frontend-next:
    build: ./frontend-next
    # ports:
    #   - 3001:3000
    depends_on:
      - web
  
  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data/  
    environment:
      - "POSTGRES_HOST_AUTH_METHOD=trust"

  ai-server:
    build: 
      context: .
      dockerfile: ai_server/Dockerfile
    ports:
      - 5555:5555
    depends_on:
      - web
    volumes:
      - ./game_logic:/code/game_logic
      - ./ai_server:/code

  redis:
    image: redis:5
    command: redis-server --replica-read-only no --timeout 0
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 5

  web:
    build: 
      context: .
      dockerfile: battleship/Dockerfile
    command: gunicorn battleship.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./battleship:/code
      - ./game_logic:/code/game_logic
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy

  daphne:
    build:
      context: .
      dockerfile: battleship/Dockerfile
    command: daphne -b 0.0.0.0 -p 8001 battleship.asgi:application
    volumes:
      - ./battleship:/code
      - ./game_logic:/code/game_logic
    ports:
      - 8001:8001
    depends_on:
      - web

volumes:
  postgres_data:
  redisdata: