# docker-compose.prod.yml
services:
  nginx:
    volumes:
      - /etc/letsencrypt/live/shippinghazards.com/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
      - /etc/letsencrypt/live/shippinghazards.com/privkey.pem:/etc/ssl/private/privkey.pem:ro
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
